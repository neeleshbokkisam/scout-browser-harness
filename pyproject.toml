[project]
name = "scout-browser-harness"
version = "0.1.0"
description = "Personal Exa work trial: Scout + browser tools on Odysseys2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
